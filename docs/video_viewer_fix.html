<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>影片播放</title>
<style>
:root{ --bg:#0b0f17; --card:#121826; --text:#e6ecff; --muted:#9bb0ff; --accent:#7aa2ff; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans TC',PingFangTC,'Microsoft JhengHei',sans-serif;}
.wrap{max-width:1200px;margin:0 auto;padding:18px}
.header{
  display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding:14px 16px;border-radius:16px;background:var(--card);
  box-shadow:0 10px 40px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.04)
}
h1{margin:0;font-size:18px}
a{color:var(--accent);text-decoration:none;font-weight:800}
.player{
  margin-top:14px;border-radius:18px;overflow:hidden;background:#000;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 12px 50px rgba(0,0,0,.5)
}
video{width:100%;height:auto;display:block;max-height:80vh}
.note{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.6}

.btn{
  appearance:none;border:1px solid rgba(255,255,255,.16);
  background:rgba(18,24,38,.6); color:var(--text);
  padding:8px 12px;border-radius:12px;cursor:pointer;font-weight:800;
}
.btn:hover{filter:brightness(1.1)}

</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1 id="vt">影片播放</h1>
      <button class="btn" id="close">關閉</button>
    </div>

    <div class="player">
      <video id="vv" controls playsinline preload="metadata"></video>
    </div>

    <div class="note">
      小提示：若你是放在本機資料夾直接開啟（file://），部分瀏覽器可能會限制 mp4 載入；建議用簡易本機伺服器或放到網站空間測試。
    </div>
  </div>

<script>
(function(){
  const p = new URLSearchParams(location.search);
  const src = p.get('src') || 'image/slot_2024.mp4';
  const title = p.get('title') || '影片播放';
  document.getElementById('vt').textContent = title;
  const v = document.getElementById('vv');
  v.src = src;
  v.autoplay = true;

  const c = document.getElementById('close');
  if(c){
    c.addEventListener('click', ()=>{
      window.close();
      setTimeout(()=>{
        if(document.visibilityState !== 'hidden') location.href='index.html#portfolio?sub=video';
      }, 120);
});
  }
})();
</script>
</body>
</html>
